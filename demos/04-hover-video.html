<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 — Hover Video Cards</title>
<link rel="stylesheet" href="../lib/tokens.css">
<style>
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 40px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .video-card {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    cursor: pointer;
    background: var(--ink);
  }
  .video-card img,
  .video-card video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* video sits under a fading poster — hover crossfades them */
  .video-card video { opacity: 0; transition: opacity 0.4s; }
  .video-card.is-playing video { opacity: 1; }

  /* subtle scale on hover — their cards breathe, never jump */
  .video-card img, .video-card video {
    transition: opacity 0.4s, transform 1s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .video-card:hover img, .video-card:hover video { transform: scale(1.04); }

  .video-card figcaption {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    background: var(--bg); color: var(--ink);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 6px 10px;
  }
</style>
</head>
<body>

  <header class="demo-header">
    <span><span class="dot"></span>04 <em class="slash"></em> Hover Video</span>
    <a href="../index.html">← Library</a>
  </header>

  <main>
    <h1 class="ttu" style="font-size: clamp(28px,5vw,56px)">Poster first, motion on demand</h1>
    <p style="max-width: 480px; color: var(--grey); margin-top: 8px;">
      Videos have <strong>no src</strong> until you approach or hover them —
      zero bandwidth up front. Swap the data-src URLs for your own clips.
    </p>

    <div class="grid">
      <figure class="video-card">
        <img src="https://picsum.photos/seed/vid1/800/450" alt="">
        <video data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
               muted loop playsinline preload="metadata"></video>
        <figcaption><span class="dot"></span>Flower / Hover me</figcaption>
      </figure>

      <figure class="video-card">
        <img src="https://picsum.photos/seed/vid2/800/450" alt="">
        <video data-src="https://www.w3schools.com/html/mov_bbb.mp4"
               muted loop playsinline preload="metadata"></video>
        <figcaption><span class="dot"></span>Big Buck Bunny / Hover me</figcaption>
      </figure>
    </div>
  </main>

  <script src="../lib/lazy-video.js"></script>
  <script> initHoverVideos('.video-card'); </script>
</body>
</html>
