<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 — Cursor Carousel</title>
<link rel="stylesheet" href="../lib/tokens.css">
<style>
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { text-transform: uppercase; font-size: clamp(28px, 5vw, 56px); }
  .hint { color: var(--grey); margin: 8px 0 40px; max-width: 460px; }
  .carousel-wrap { max-width: 820px; }
</style>
</head>
<body>

  <header class="demo-header">
    <span><span class="dot"></span>09 <em class="slash"></em> Cursor Carousel</span>
    <a href="../index.html">← Library</a>
  </header>

  <main>
    <h1>The cursor is the UI</h1>
    <p class="hint">From their About page: click anywhere on the image to advance.
       Upcoming slides preview as thumbnails trailing your cursor; the next image
       wipes in with a clip-path while the old one settles back.</p>

    <div class="carousel-wrap"><div id="carousel"></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="../lib/carousel-cursor.js"></script>
  <script>
    new CursorCarousel(document.getElementById('carousel'), {
      images: [
        'https://picsum.photos/seed/cc1/1200/750',
        'https://picsum.photos/seed/cc2/1200/750',
        'https://picsum.photos/seed/cc3/1200/750',
        'https://picsum.photos/seed/cc4/1200/750',
        'https://picsum.photos/seed/cc5/1200/750',
      ],
    });
  </script>
</body>
</html>
