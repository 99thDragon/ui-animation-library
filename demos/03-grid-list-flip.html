<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 — Grid/List FLIP Morph</title>
<link rel="stylesheet" href="../lib/tokens.css">
<style>
  main { padding: 24px; }

  /* GRID / LIST toggle — fixed like the original */
  .toggle {
    position: fixed; top: 50%; right: 24px; z-index: 10;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
    text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em;
  }
  .toggle button { text-align: right; padding: 4px; color: var(--grey); }
  .toggle button.is-active { color: var(--ink); }
  .toggle button.is-active::before { content: "● "; color: var(--red); }

  /* GRID layout (default) */
  .work {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px; margin: 60px auto 0;
  }
  .work-item { display: flex; flex-direction: column; gap: 8px; }
  .work-item img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .work-item__title { text-transform: uppercase; font-weight: 600; }
  .work-item__meta { font-size: 11px; color: var(--grey); }

  /* LIST layout — same DOM, different CSS. Flip animates the diff. */
  .work.is-list { display: flex; flex-direction: column; gap: 0; }
  .work.is-list .work-item {
    flex-direction: row; align-items: center; gap: 24px;
    padding: 14px 0; border-top: 1px solid rgba(11,11,11,0.2);
  }
  .work.is-list .work-item img { width: 180px; }
  .work.is-list .work-item__title { font-size: 22px; flex: 1; }

  @media (max-width: 700px) { .work { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

  <header class="demo-header">
    <span><span class="dot"></span>03 <em class="slash"></em> Grid ⇄ List FLIP</span>
    <a href="../index.html">← Library</a>
  </header>

  <div class="toggle">
    <button data-layout="grid" class="is-active">Grid</button>
    <button data-layout="list">List</button>
  </div>

  <main>
    <div class="work" id="work"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
  <script src="../lib/flip-layout.js"></script>
  <script>
    gsap.registerPlugin(Flip);

    // build 9 demo cards
    const titles = ['Jade Shadows','The Mountain','Godiva','Touchland','Hades II',
                    'Cowboy Bebop','Humility','Marvel Snap','Battle Aces'];
    document.getElementById('work').innerHTML = titles.map((t, i) => `
      <figure class="work-item">
        <img src="https://picsum.photos/seed/flip${i}/640/360" alt="">
        <figcaption class="work-item__title">${t}</figcaption>
        <span class="work-item__meta"><span class="dot"></span>Branded / ${String(i+1).padStart(2,'0')}</span>
      </figure>`).join('');

    new LayoutToggle({
      container: '#work',
      items: '.work-item',
      buttons: '[data-layout]',
    });
  </script>
</body>
</html>
